name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} C++${{ matrix.std }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++-14, std: 20, build_type: Release }
          - { compiler: g++-13, std: 17, build_type: Debug }
          - { compiler: clang++-18, std: 20, build_type: Release }
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMX_CXX_STANDARD=${{ matrix.std }}
          -DMX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Benchmark smoke run
        if: matrix.build_type == 'Release'
        run: ./build/bin/miniexchange_bench --quick

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Reduce ASLR entropy (required by TSan on recent kernels)
        if: matrix.sanitizer == 'TSAN'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMX_ENABLE_${{ matrix.sanitizer }}=ON
          -DMX_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (compiles and runs the tests inside)
        run: docker build -t miniexchange .
      - name: Run the scripted demo
        run: docker run --rm miniexchange --script /opt/miniexchange/demo.txt
